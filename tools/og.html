<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Archivo"; font-weight: 400 800; src: url("../src/fonts/archivo-var.woff2") format("woff2-variations"); }
@font-face { font-family: "Plex"; font-weight: 400; src: url("../src/fonts/ibm-plex-mono-400.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #05070a; color: #e9eef4; font-family: Archivo, sans-serif; overflow: hidden; position: relative; }
canvas { position: absolute; inset: 0; }
.scrim { position: absolute; inset: 0; background: linear-gradient(100deg, #05070a 10%, rgba(5,7,10,0.72) 46%, transparent 74%), linear-gradient(180deg, #05070a 0%, transparent 26%); }
.in { position: absolute; inset: 0; padding: 74px 78px; display: flex; flex-direction: column; justify-content: space-between; }
.kick { font-family: Plex, monospace; font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase; color: #6f8090; display: flex; align-items: center; gap: 16px; }
.kick i { width: 9px; height: 9px; border-radius: 50%; background: #3fd2e6; box-shadow: 0 0 14px #3fd2e6; }
h1 { font-size: 88px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; max-width: 15ch; }
h1 em { font-style: normal; color: #f7b733; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; border-top: 1px solid rgba(126,163,190,0.18); padding-top: 22px; }
.foot span { font-family: Plex, monospace; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: #a9b7c6; }
.foot .b { color: #f7b733; }
</style></head><body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="scrim"></div>
<div class="in">
  <div class="kick"><i></i> Peyton Lindogan <span style="color:#3a4a58">/</span> Data Product Manager</div>
  <h1>I build data products for the energy value chain.</h1>
  <div class="foot"><span>Forecast vs actuals &middot; indexed to plan</span><span class="b">peytonhl.github.io</span></div>
</div>
<script>
const ACT=[100.5,99.2,101.8,102.6,102.4,100.9,99.4,95.0,93.4,96.5,98.1,99.3];
const HALF=[1.2,1.8,2.4,3.0,3.5,4.0,4.4,4.8,5.2,5.5,5.8,6.0];
const c=document.getElementById('c'),x=c.getContext('2d'),W=1200,H=630;
const yTop=H*0.26,yBot=H*0.94,MIN=88,MAX=112;
const px=i=>(i/11)*W, py=v=>yBot-((v-MIN)/(MAX-MIN))*(yBot-yTop);
function cv(p){const d=[`M ${p[0][0]} ${p[0][1]}`];for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],e=p[i+1],f=p[i+2]||e;d.push(`C ${b[0]+(e[0]-a[0])/6} ${b[1]+(e[1]-a[1])/6}, ${e[0]-(f[0]-b[0])/6} ${e[1]-(f[1]-b[1])/6}, ${e[0]} ${e[1]}`);}return d.join(' ');}
const hi=HALF.map((d,i)=>[px(i),py(100+d)]), lo=HALF.map((d,i)=>[px(i),py(100-d)]), ac=ACT.map((v,i)=>[px(i),py(v)]);
x.strokeStyle='rgba(126,163,190,0.08)';
for(let i=0;i<12;i+=2){const q=Math.round(px(i))+0.5;x.beginPath();x.moveTo(q,H*0.2);x.lineTo(q,H);x.stroke();}
for(const v of [90,100,110]){const q=Math.round(py(v))+0.5;x.beginPath();x.moveTo(0,q);x.lineTo(W,q);x.stroke();}
const back=cv([...lo].reverse()).replace(/^M\s*([-\d.]+)\s+([-\d.]+)/,'L $1 $2');
x.fillStyle='rgba(122,160,190,0.10)'; x.fill(new Path2D(`${cv(hi)} ${back} Z`));
x.setLineDash([5,6]); x.lineWidth=1.6; x.strokeStyle='rgba(122,160,190,0.5)';
x.stroke(new Path2D(cv(hi))); x.stroke(new Path2D(cv(lo))); x.setLineDash([]);
x.setLineDash([2,5]); x.strokeStyle='rgba(160,180,198,0.5)'; x.lineWidth=1.4;
x.beginPath(); x.moveTo(0,py(100)); x.lineTo(W,py(100)); x.stroke(); x.setLineDash([]);
const g=new Path2D(); g.moveTo(ac[7][0],ac[7][1]);
for(let i=7;i<=8;i++) g.lineTo(ac[i][0],ac[i][1]);
for(let i=8;i>=7;i--) g.lineTo(lo[i][0],lo[i][1]);
g.closePath(); x.fillStyle='rgba(247,183,51,0.3)'; x.fill(g);
x.strokeStyle='rgba(247,183,51,0.97)'; x.lineWidth=3.4; x.lineJoin='round';
x.shadowColor='rgba(247,183,51,0.4)'; x.shadowBlur=14; x.stroke(new Path2D(cv(ac)));
</script>
</body></html>
