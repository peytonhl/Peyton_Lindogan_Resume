<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Archivo"; font-weight: 400 800; src: url("../src/fonts/archivo-var.woff2") format("woff2-variations"); }
@font-face { font-family: "Plex"; font-weight: 400; src: url("../src/fonts/ibm-plex-mono-400.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #05070a; color: #e9eef4; font-family: Archivo, sans-serif; overflow: hidden; position: relative; }
canvas { position: absolute; inset: 0; }
.scrim { position: absolute; inset: 0; background: linear-gradient(100deg, #05070a 10%, rgba(5,7,10,0.72) 46%, transparent 74%), linear-gradient(180deg, #05070a 0%, transparent 26%); }
.in { position: absolute; inset: 0; padding: 74px 78px; display: flex; flex-direction: column; justify-content: space-between; }
.kick { font-family: Plex, monospace; font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase; color: #6f8090; display: flex; align-items: center; gap: 16px; }
.kick i { width: 9px; height: 9px; border-radius: 50%; background: #3fd2e6; box-shadow: 0 0 14px #3fd2e6; }
h1 { font-size: 88px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; max-width: 15ch; }
h1 em { font-style: normal; color: #f7b733; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; border-top: 1px solid rgba(126,163,190,0.18); padding-top: 22px; }
.foot span { font-family: Plex, monospace; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: #a9b7c6; }
.foot .b { color: #f7b733; }
</style></head><body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="scrim"></div>
<div class="in">
  <div class="kick"><i></i> Peyton Lindogan <span style="color:#3a4a58">/</span> Data Product Manager</div>
  <h1>I build data products for the <em>energy value chain</em>.</h1>
  <div class="foot"><span>NextEra Energy &middot; Berkeley MIDS</span><span class="b">peytonhl.github.io</span></div>
</div>
<script>
const L=[0.34,0.30,0.28,0.27,0.28,0.33,0.42,0.52,0.58,0.56,0.52,0.49,0.47,0.46,0.48,0.54,0.65,0.80,0.93,1.00,0.95,0.82,0.64,0.46];
const c=document.getElementById('c'), x=c.getContext('2d'), W=1200,H=630, yTop=H*0.38, yBot=H*0.99;
const pts=L.map((v,i)=>[(i/(L.length-1))*W, yBot-v*(yBot-yTop)]);
function sp(p){const d=[`M ${p[0][0]} ${p[0][1]}`];for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],e=p[i+1],f=p[i+2]||e;d.push(`C ${b[0]+(e[0]-a[0])/6} ${b[1]+(e[1]-a[1])/6}, ${e[0]-(f[0]-b[0])/6} ${e[1]-(f[1]-b[1])/6}, ${e[0]} ${e[1]}`);}return d.join(' ');}
x.strokeStyle='rgba(126,163,190,0.08)';
for(let i=0;i<24;i+=3){const px=Math.round((i/23)*W)+0.5;x.beginPath();x.moveTo(px,H*0.25);x.lineTo(px,H);x.stroke();}
for(let r=0;r<=4;r++){const py=Math.round(H*0.38+(r/4)*(H*0.58))+0.5;x.beginPath();x.moveTo(0,py);x.lineTo(W,py);x.stroke();}
const d=sp(pts), fill=new Path2D(d); fill.lineTo(W,H); fill.lineTo(0,H); fill.closePath();
const g=x.createLinearGradient(0,H*0.35,0,H); g.addColorStop(0,'rgba(247,183,51,0.22)'); g.addColorStop(1,'rgba(247,183,51,0)');
x.fillStyle=g; x.fill(fill);
x.strokeStyle='rgba(247,183,51,0.95)'; x.lineWidth=2.4; x.shadowColor='rgba(247,183,51,0.6)'; x.shadowBlur=18; x.stroke(new Path2D(d));
</script>
</body></html>
